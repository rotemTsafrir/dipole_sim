<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EM Field Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: black;
        color: white;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="startup-status" role="status" style="padding:24px">Loading EM Simulator…</div>
    <script>
      window.addEventListener('error', function (event) {
        var status = document.getElementById('startup-status');
        if (status) status.textContent = 'Could not start EM Simulator: ' + (event.message || 'a required file failed to load.');
      });
    </script>
    <script src="em-simulator.js?v=20261010-4" onerror="document.getElementById('startup-status').textContent='Could not load em-simulator.js. Extract both files into the same folder.'"></script>
    <script>
      (function () {
        var status = document.getElementById('startup-status');
        if (typeof window.p5 !== 'function') {
          status.textContent = 'Could not load p5.js. Check your internet connection and reload.';
        } else if (typeof window.setup !== 'function' || typeof window.draw !== 'function') {
          status.textContent = 'The simulator script did not load correctly. Extract both files from the ZIP into the same folder and reload.';
        } else {
          var simulatorSetup = window.setup;
          window.setup = function () {
            simulatorSetup();
            status.remove();
          };
        }
      })();
    </script>
  </body>
</html>
